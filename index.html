<title>Fifteen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
/* Layout: one tall poster column; big photo, stacked countdown, facts strip. Burgundy and black, dark, single theme. */
:root{--bg:#0d0709;--fg:#f5e9ea;--muted:#b79a9f;--red:#9c1a3c;--hi:#e5617f;--panel:#1a0b10;--line:#3a1621;--ink-on-red:#fff;--sky:#2a0e17;color-scheme:dark;
--display:'Anton','Impact',sans-serif;--body:'Barlow',system-ui,sans-serif;--util:'Barlow Condensed','Arial Narrow',sans-serif}
body{background:var(--bg);color:var(--fg);font-family:var(--body);padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:20px}
.kick{font-family:var(--util);font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--hi);font-size:14px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(64px,22vw,128px);line-height:.92;margin:4px 0 0;text-transform:uppercase;text-wrap:balance}
h1 span{color:var(--hi)}
.photo{position:relative;border-radius:4px;overflow:hidden;background:var(--sky);aspect-ratio:720/858;max-width:100%}
.photo img{display:block;width:100%;height:100%;object-fit:cover}
.photo .num{position:absolute;right:12px;bottom:-14px;font-family:var(--display);font-size:clamp(120px,40vw,220px);line-height:1;color:#fff;text-shadow:0 3px 0 var(--red),0 0 24px rgba(156,26,60,.7)}
.stripes{display:flex;gap:6px}.stripes i{flex:1;height:8px;background:var(--red)}.stripes i:nth-child(even){background:var(--sky)}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cd div{background:var(--panel);border:1px solid var(--line);padding:14px 4px 10px;text-align:center;min-width:0}
.cd b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(34px,11vw,56px);line-height:1;font-variant-numeric:tabular-nums}
.cd small{font-family:var(--util);text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-size:12px}
.msg{font-family:var(--util);font-weight:500;font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.facts div{border-top:3px solid var(--red);padding-top:8px}
.facts b{display:block;font-family:var(--display);font-weight:400;font-size:30px;font-variant-numeric:tabular-nums}
.facts span{color:var(--muted);font-size:14px}
button{font:600 16px var(--util);letter-spacing:.12em;text-transform:uppercase;background:var(--red);color:var(--ink-on-red);border:0;padding:16px 20px;cursor:pointer;width:100%}
button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
@media (prefers-reduced-motion:reduce){canvas{display:none}}
</style>

<script>
// Born 12 Nov 2011. Next birthday 12 Nov 2026, Cairo time.
var BORN=new Date('2011-11-12T00:00:00+02:00'), NEXT=new Date('2026-11-12T00:00:00+02:00');
var $=function(i){return document.getElementById(i)};
function pad(n){return String(n).padStart(2,'0')}
function tick(){
  var now=new Date(),ms=NEXT-now;
  var life=Math.floor((now-BORN)/864e5);
  $('dl').textContent=life.toLocaleString();$('wl').textContent=Math.floor(life/7).toLocaleString();
  if(ms<=0){$('msg').textContent='Happy birthday!';['d','h','m','s'].forEach(function(k){$(k).textContent='00'});return}
  var s=Math.floor(ms/1000);
  $('d').textContent=Math.floor(s/86400);$('h').textContent=pad(Math.floor(s%86400/3600));
  $('m').textContent=pad(Math.floor(s%3600/60));$('s').textContent=pad(s%60);
}
tick();setInterval(tick,1000);
var cv=$('fx'),cx=cv.getContext('2d'),P=[],run=false;
function fit(){cv.width=innerWidth;cv.height=innerHeight}fit();addEventListener('resize',fit);
function burst(){
  var cols=['#9c1a3c','#c2284f','#f5e9ea','#e5617f','#f2c14e'];
  for(var i=0;i<140;i++)P.push({x:innerWidth/2,y:innerHeight*.6,vx:(Math.random()-.5)*14,vy:-Math.random()*16-4,r:Math.random()*5+3,c:cols[i%5],a:1});
  if(!run){run=true;requestAnimationFrame(loop)}
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.a-=.01;cx.globalAlpha=Math.max(p.a,0);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.r,p.r*1.6)});
  P=P.filter(function(p){return p.a>0&&p.y<cv.height+20});
  if(P.length)requestAnimationFrame(loop);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}
}
$('go').addEventListener('click',burst);
</script>
